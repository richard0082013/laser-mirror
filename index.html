<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#221d55" />
    <meta name="description" content="转动镜子，把激光引到每一颗水晶上。" />
    <title>Laser Mirror | 激光反射</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="激光反射 Laser Mirror" />
    <meta property="og:description" content="转动镜子，把激光引到每一颗水晶上。每天一道题，和朋友比步数。" />
    <meta property="og:url" content="https://richard0082013.github.io/laser-mirror/" />
    <meta property="og:image" content="https://richard0082013.github.io/laser-mirror/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="select-screen" hidden>
      <header class="hero">
        <div class="hero-top">
          <h1 id="game-title" class="game-title"></h1>
          <div class="hero-buttons">
            <button class="coin-pill" type="button"></button>
            <button class="mute icon-button" type="button"></button>
          </div>
        </div>
        <div class="hero-beam" aria-hidden="true"></div>
        <div class="hero-actions">
          <button id="resume" class="primary" type="button"></button>
          <span class="total"><span class="star earned" aria-hidden="true"></span><span id="total-stars"></span></span>
          <label id="language"><select id="language-select"></select></label>
        </div>
        <p id="select-note" role="status"></p>
      </header>
      <section id="daily-card" aria-labelledby="daily-title">
        <div class="daily-text">
          <div class="daily-top">
            <h2 id="daily-title"></h2>
            <span id="daily-meta"></span>
          </div>
          <p id="daily-summary"></p>
        </div>
        <button id="daily-start" type="button"></button>
        <button id="daily-copy" class="icon-button" type="button" hidden></button>
        <button id="daily-history" class="icon-button" type="button"></button>
        <pre id="daily-share" hidden></pre>
        <span id="daily-copied" role="status"></span>
      </section>
      <section id="chapters" aria-live="polite">
        <div class="chapter-pager">
          <button id="chapter-prev" class="icon-button" type="button"></button>
          <div class="chapter-title">
            <h2 id="chapter-name"></h2>
            <span id="chapter-gate" class="gate"></span>
          </div>
          <button id="chapter-next" class="icon-button" type="button"></button>
        </div>
        <div id="chapter-tiles" class="tiles"></div>
      </section>
    </main>

    <main id="game-screen" hidden>
      <header id="hud">
        <button id="back" class="icon-button" type="button"></button>
        <h1><span id="level-number"></span><span id="level-name"></span></h1>
        <div id="pips" role="img"></div>
        <button class="coin-pill" type="button"></button>
        <button class="mute icon-button" type="button"></button>
      </header>
      <div id="board-frame">
      <canvas
        id="board"
        tabindex="0"
      ></canvas>
      </div>
      <div id="score">
        <span id="step-count"></span>
        <span id="par-note"></span>
        <span id="inventory-note"></span>
        <span id="stars" role="img"></span>
      </div>
      <p id="status" role="status"></p>
      <footer id="footer">
        <div id="tools">
          <button id="hint" class="icon-button tool" type="button"></button>
          <button id="preview" class="icon-button tool" type="button"></button>
          <button id="undo" class="icon-button tool" type="button"></button>
        </div>
        <span class="spacer"></span>
        <button id="restart" class="icon-button" type="button"></button>
        <button id="skip" class="icon-button" type="button"></button>
        <button id="next" class="primary icon-button" type="button" hidden></button>
      </footer>
    </main>

    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-body">
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <span class="coin-balance"><span class="coin" aria-hidden="true"></span><span id="sheet-coins"></span></span>
          <button id="sheet-close" class="icon-button" type="button"></button>
        </header>
        <p id="sheet-reward"></p>
        <p id="sheet-text"></p>
        <div id="sheet-daily" hidden>
          <pre id="sheet-share"></pre>
          <div class="sheet-copy">
            <button id="sheet-copy" class="icon-button" type="button"></button>
            <button id="sheet-image" class="icon-button" type="button"></button>
            <span id="sheet-copied" role="status"></span>
          </div>
        </div>
        <div id="sheet-history" hidden>
          <p class="shop-note" id="history-note"></p>
          <div id="history-grid"></div>
        </div>
        <button id="shop-toggle" type="button"></button>
        <div id="sheet-shop">
          <div id="item-table"></div>
          <p class="shop-note" id="shop-note"></p>
          <details class="fold">
            <summary id="rules-title"></summary>
            <p class="shop-note" id="item-rules"></p>
          </details>
          <div id="draw-box">
            <div id="draw-stage" aria-hidden="true"></div>
            <div class="draw-text">
              <h3 id="draw-title"></h3>
              <details class="fold">
                <summary id="odds-title"></summary>
                <p id="draw-odds"></p>
              </details>
            </div>
            <button id="draw" type="button"></button>
          </div>
          <p id="draw-result" role="status"></p>
          <div id="skin-row"></div>
          <div id="settings"></div>
        </div>
        <div id="install-row" hidden>
          <div class="draw-text">
            <h3 id="install-title"></h3>
            <p id="install-detail"></p>
          </div>
          <button id="install" type="button"></button>
        </div>
        <div id="daily-invite" hidden>
          <div class="draw-text">
            <h3 id="invite-title"></h3>
            <p id="invite-body"></p>
          </div>
          <button id="invite-go" type="button"></button>
        </div>
        <button id="sheet-next" class="primary" type="button"></button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
