<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#221d55" />
    <title>激光反射</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="hud">
      <h1><span id="level-number"></span><span id="level-name"></span></h1>
      <div id="pips" role="img"></div>
    </header>
    <canvas
      id="board"
      tabindex="0"
      aria-label="激光反射棋盘。方向键选择镜子，回车或空格旋转。"
    ></canvas>
    <div id="energy" role="img">
      <span>能量</span>
      <span id="energy-cells"></span>
      <span id="energy-count"></span>
    </div>
    <footer id="footer">
      <p id="status" role="status"></p>
      <button id="restart" type="button">重新开始</button>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
