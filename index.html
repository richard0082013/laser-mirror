<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#221d55" />
    <meta name="description" content="转动镜子，把激光引到每一颗水晶上。" />
    <title>激光反射</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="select-screen" hidden>
      <header class="hero">
        <div class="hero-top">
          <h1 class="game-title">激光反射</h1>
          <button class="mute small-button" type="button"></button>
        </div>
        <div class="hero-beam" aria-hidden="true"></div>
        <p class="tagline">转动镜子，把激光引到每一颗水晶上。</p>
        <div class="hero-actions">
          <button id="resume" class="primary" type="button"></button>
          <span class="total"><span class="star earned" aria-hidden="true"></span><span id="total-stars"></span></span>
        </div>
        <p id="select-note" role="status"></p>
      </header>
      <section id="daily-card" aria-labelledby="daily-title">
        <div class="daily-top">
          <h2 id="daily-title">今日一题</h2>
          <span id="daily-meta"></span>
        </div>
        <p id="daily-summary"></p>
        <pre id="daily-share" hidden></pre>
        <div class="daily-actions">
          <button id="daily-start" type="button"></button>
          <button id="daily-copy" class="small-button" type="button" hidden>复制成绩</button>
          <span id="daily-copied" role="status"></span>
        </div>
      </section>
      <div id="chapters"></div>
      <section id="shop" aria-labelledby="shop-title">
        <div class="chapter-header">
          <h2 id="shop-title">商店</h2>
          <span class="coin-balance"><span class="coin" aria-hidden="true"></span><span id="shop-coins"></span></span>
        </div>
        <p class="shop-note">玩每日一题和第一次过关能拿金币。道具只能在闯关里用。</p>
        <div id="shop-items"></div>
      </section>
    </main>

    <main id="game-screen" hidden>
      <header id="hud">
        <h1><span id="level-number"></span><span id="level-name"></span></h1>
        <div id="pips" role="img"></div>
      </header>
      <canvas
        id="board"
        tabindex="0"
        aria-label="激光反射棋盘。方向键选择格子，回车或空格操作。"
      ></canvas>
      <div id="score">
        <span id="step-count"></span>
        <span id="par-note"></span>
        <span id="inventory-note"></span>
        <span id="stars" role="img"></span>
      </div>
      <p id="status" role="status"></p>
      <p id="reward" role="status"></p>
      <div id="result" hidden>
        <pre id="result-share"></pre>
        <div class="daily-actions">
          <button id="result-copy" class="primary" type="button">复制成绩</button>
          <span id="result-copied" role="status"></span>
        </div>
      </div>
      <div id="tools">
        <button id="hint" type="button"></button>
        <button id="preview" type="button"></button>
        <button id="undo" type="button"></button>
        <span class="coin-balance"><span class="coin" aria-hidden="true"></span><span id="game-coins"></span></span>
      </div>
      <footer id="footer">
        <button id="back" class="small-button" type="button">选关</button>
        <button class="mute small-button" type="button"></button>
        <span class="spacer"></span>
        <button id="restart" type="button">重新开始</button>
        <button id="skip" type="button">跳过这关</button>
        <button id="next" class="primary" type="button" hidden>下一关</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
